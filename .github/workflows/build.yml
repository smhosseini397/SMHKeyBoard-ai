
name: Build SMHKeyboard AI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch transformers sentencepiece onnx onnxscript

      - name: Verify export script
        run: |
          test -f scripts/export_persian_albert_onnx.py
          echo "Export script found."

      - name: Export Persian ALBERT ONNX
        run: |
          python scripts/export_persian_albert_onnx.py

      - name: Verify generated model
        run: |
          test -s app/src/main/assets/semantic/albert_persian_mlm.onnx
          test -s app/src/main/assets/semantic/tokenizer.json
          echo "ONNX and tokenizer files exist."
          ls -lh app/src/main/assets/semantic/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMHKeyboard-AI-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
