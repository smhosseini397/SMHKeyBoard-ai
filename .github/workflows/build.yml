
name: Build SmhKeyboard IA Android APK

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:

    name: Build SmhKeyboard IA
    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      # ------------------------------------------
      # Checkout
      # ------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v6

      # ------------------------------------------
      # Java
      # ------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # ------------------------------------------
      # Android SDK
      # ------------------------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      # ------------------------------------------
      # Gradle
      # ------------------------------------------

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # ------------------------------------------
      # Python
      # ------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      # ------------------------------------------
      # Install AI Model Dependencies
      # ------------------------------------------

      - name: Install Persian ALBERT Dependencies
        run: |
          python -m pip install --upgrade pip

          python -m pip install numpy==1.26.4

          python -m pip install \
            torch==2.6.0 \
            --index-url https://download.pytorch.org/whl/cpu

          python -m pip install \
            transformers==4.53.1 \
            sentencepiece==0.2.0 \
            onnx==1.17.0 \
            safetensors==0.5.3

          python -m pip check

      # ------------------------------------------
      # Download and Export Persian ALBERT
      # ------------------------------------------

      - name: Export Persian ALBERT to ONNX
        env:
          HF_HOME: ${{ runner.temp }}/huggingface-cache
        run: |
          python scripts/export_persian_albert_onnx.py

      # ------------------------------------------
      # Verify AI Model Assets
      # ------------------------------------------

      - name: Verify AI Model Assets
        run: |
          set -e

          MODEL_DIR="app/src/main/assets/semantic"

          test -s "$MODEL_DIR/albert_persian_mlm.onnx"
          test -s "$MODEL_DIR/spiece.model"
          test -s "$MODEL_DIR/special_tokens.json"
          test -s "$MODEL_DIR/model_manifest.json"

          python - <<'PY'
          import json
          import onnx
          import sentencepiece as spm

          from pathlib import Path

          folder = Path("app/src/main/assets/semantic")

          with open(folder / "special_tokens.json", encoding="utf-8") as f:
              tokens = json.load(f)

          required = [
              "cls_token_id",
              "sep_token_id",
              "mask_token_id",
              "unk_token_id",
              "pad_token_id",
          ]

          for key in required:
              assert key in tokens, f"Missing token: {key}"

          sp = spm.SentencePieceProcessor(
              model_file=str(folder / "spiece.model")
          )

          assert sp.get_piece_size() > 0

          model = onnx.load(
              str(folder / "albert_persian_mlm.onnx")
          )

          onnx.checker.check_model(model)

          print("ONNX validation: OK")
          print("SentencePiece validation: OK")
          print("Special tokens validation: OK")
          print("Vocabulary size:", sp.get_piece_size())
          PY

          du -h "$MODEL_DIR"/*

      # ------------------------------------------
      # Verify Learning Resources
      # ------------------------------------------

      - name: Verify Learning Resources
        run: |
          set -e

          test -s KeyFarsi-Learning/learning_profile_template.json
          test -s KeyFarsi-Learning/learning_profile.schema.json
          test -s KeyFarsi-Learning/seed_corrections.json

          test -s app/src/main/assets/learning/learning_profile_template.json
          test -s app/src/main/assets/learning/learning_profile.schema.json
          test -s app/src/main/assets/learning/seed_corrections.json

          cmp KeyFarsi-Learning/learning_profile_template.json \
              app/src/main/assets/learning/learning_profile_template.json

          cmp KeyFarsi-Learning/learning_profile.schema.json \
              app/src/main/assets/learning/learning_profile.schema.json

          cmp KeyFarsi-Learning/seed_corrections.json \
              app/src/main/assets/learning/seed_corrections.json

      # ------------------------------------------
      # Build Android APK
      # ------------------------------------------

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      # ------------------------------------------
      # Verify APK
      # ------------------------------------------

      - name: Verify APK
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "APK BUILD SUCCESSFUL"

          ls -lh "$APK"

      # ------------------------------------------
      # Upload APK
      # ------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: SmhKeyboard-IA-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # ------------------------------------------
      # Upload Build Reports
      # ------------------------------------------

      - name: Upload Build Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: SmhKeyboard-IA-build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
            app/build/outputs/apk/
          if-no-files-found: ignore
          retention-days: 7
